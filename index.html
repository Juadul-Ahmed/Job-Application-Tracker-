<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Tailwind + Daisy-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
        
      }
    </style>
    <title>Job Tracker</title>
  </head>
  <body class="w-11/12 mx-auto bg-base-200">
    <section>
      <header>
        <h1 class="font-bold text-2xl text-[#002C5C] mt-8 mb-8">
          Job Application Tracker
        </h1>

        <div class="card-container flex justify-center items-center gap-4 mb-8">

        <div class="card bg-base-100 w-[360px] shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Total</h2>
            <p class="font-semibold text-xl text-[#002C5C]">
              8
            </p>
          </div>
        </div>
        <div class="card bg-base-100 w-[360px] shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Interview</h2>
            <p  class="font-semibold text-xl text-[#10B981]">
              0
            </p>
          </div>
        </div>
        <div class="card bg-base-100 w-[360px] shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Rejected</h2>
            <p  class="font-semibold text-xl text-[#EF4444]">
              0
            </p>
          </div>
        </div>

        </div>
      </header>
    </section>


      

  </body>
</html>
